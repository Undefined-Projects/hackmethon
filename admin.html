<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Equipos registrados · HACK(ME)THON</title>
<meta name="theme-color" content="#0a070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  main{ animation:none; }                      /* el panel no glitchea: aquí se trabaja */
  .adm{ width:100%; max-width:1100px; margin-inline:auto; padding:24px var(--gut) 60px; }
  .adm__sum{ display:flex; flex-wrap:wrap; gap:0 2ch; font-size:12.5px; letter-spacing:.1em; color:var(--phos-dim); margin:0 0 18px; }
  .adm__sum b{ color:var(--phos-hi); font-weight:600; }

  .eq{ border:2px solid var(--rule); margin-bottom:2px; display:grid;
       grid-template-columns:auto minmax(0,1fr) minmax(0,1fr); gap:0 clamp(14px,2vw,24px);
       padding:14px clamp(12px,2vw,18px); align-items:start; }
  @media (max-width:760px){ .eq{ grid-template-columns:auto minmax(0,1fr); } .eq__crew{ grid-column:1 / -1; margin-top:10px; } }
  .eq canvas{ border:1px solid var(--rule); display:block; image-rendering:pixelated; }
  .eq__id{ font-size:11px; letter-spacing:.14em; color:var(--phos-dim); margin:0 0 3px; }
  .eq__name{ font-family:var(--f-mono); font-weight:600; font-size:17px; color:var(--phos-hi);
             text-shadow:var(--bloom); margin:0 0 6px; word-break:break-word; }
  .eq__meta{ font-size:12px; color:var(--phos-dim); margin:0; }
  .eq__meta a{ color:var(--phos); }
  .eq__crew{ list-style:none; margin:0; padding:0; font-size:12.5px; }
  .eq__crew li{ display:flex; gap:1ch; padding:2px 0; color:var(--phos-soft); }
  .eq__crew b{ color:var(--phos-hi); font-weight:500; }
  .eq__crew .tag{ color:var(--screen); background:var(--phos); padding:0 6px; font-size:10px; letter-spacing:.1em; }
  .eq__crew .tel{ margin-left:auto; color:var(--phos-dim); font-variant-numeric:tabular-nums; }

  .vacio{ border:1px dashed var(--rule); padding:36px; text-align:center; color:var(--phos-dim); font-size:13px; }

  /* ajuste de cupo */
  .ajuste{ display:flex; align-items:center; flex-wrap:wrap; gap:1.5ch;
           border:2px solid var(--rule); border-left:3px solid var(--blue); padding:12px 16px; margin:0 0 18px; }
  .ajuste label{ font-size:12px; letter-spacing:.1em; color:var(--phos-dim); }
  .ajuste input{ width:7ch; font-family:var(--f-mono); font-size:15px; font-weight:600;
                 color:var(--phos-hi); background:rgba(250,57,186,.07);
                 border:0; border-bottom:1px solid var(--phos-dim); padding:5px 8px;
                 text-align:center; font-variant-numeric:tabular-nums; }
  .ajuste input:focus{ outline:0; background:rgba(250,57,186,.15); border-bottom-color:var(--phos); }
  .ajuste .nota{ font-size:11.5px; color:var(--phos-dim); }
  .ajuste .nota.ok{ color:var(--phos-hi); }
  .ajuste .nota.err{ color:var(--magenta); }

  /* borrar equipo */
  .eq{ position:relative; }
  .eq__borrar{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center;
               gap:1ch; margin-top:10px; padding-top:10px; border-top:1px solid var(--rule); }
  .eq__borrar button{ font-family:var(--f-mono); font-size:10.5px; letter-spacing:.1em;
                      background:transparent; color:var(--phos-dim);
                      border:1px solid var(--rule); padding:4px 10px; cursor:pointer; }
  .eq__borrar button:hover{ background:var(--magenta); color:var(--screen); border-color:var(--magenta); }
  .eq__borrar .aviso{ font-size:11.5px; color:var(--magenta); margin-right:auto; }
  .eq__borrar button.si{ background:var(--magenta); color:var(--screen); border-color:var(--magenta); font-weight:600; }
  .eq--fuera{ opacity:.3; pointer-events:none; }
  .puerta{ max-width:520px; }
  .puerta .fld > label{ width:16ch; }
</style>
</head>
<body>

<div class="tubo">



<header class="menubar">
  <a class="menubar__sys" href="index.html">HACK(ME)THON</a>
  <a class="menubar__go" href="index.html">&#9666; VOLVER A LA PORTADA</a>
</header>

<main class="adm">

  <!-- puerta -->
  <section class="panel" id="puerta" style="padding-inline:0">
    <header class="panel__bar">
      <span class="panel__id">PANEL 99</span>
      <span class="panel__name">ACCESO RESTRINGIDO</span>
      <span class="panel__stat">OPERADORES</span>
    </header>
    <div class="panel__body">
      <form class="alta puerta" id="f-puerta">
        <div class="fld">
          <label for="f-token">CONTRASEÑA</label>
          <input id="f-token" type="password" autocomplete="current-password" required>
        </div>
        <p class="msg" id="p-msg" role="status"></p>
        <p class="cta"><button class="key key--go" type="submit">ENTER &middot; ABRIR</button></p>
      </form>
    </div>
  </section>

  <!-- listado -->
  <section class="panel" id="lista" hidden style="padding-inline:0">
    <header class="panel__bar">
      <span class="panel__id">PANEL 08</span>
      <span class="panel__name">EQUIPOS REGISTRADOS</span>
      <span class="panel__stat" id="l-stat">—</span>
    </header>
    <div class="panel__body">
      <p class="adm__sum" id="l-sum"></p>

      <p class="ajuste">
        <label for="f-cupo">CUPO DE EQUIPOS</label>
        <input id="f-cupo" type="number" min="1" max="500" step="1" inputmode="numeric">
        <button class="key key--sm" id="b-cupo" type="button">GUARDAR</button>
        <span class="nota" id="cupo-msg"></span>
      </p>
      <div id="l-cuerpo"></div>
      <p class="cta" style="margin-top:20px">
        <button class="key" id="b-refresh" type="button">RECARGAR</button>
        <button class="key" id="b-csv" type="button">DESCARGAR CSV</button>
        <button class="key" id="b-salir" type="button">CERRAR SESIÓN</button>
      </p>
    </div>
    <footer class="panel__keys"><a href="index.html">PF3=SALIR</a></footer>
  </section>

</main>


</div><!-- /tubo -->

<!-- Capa fija: se curva igual que el contenido, pero no se
     desplaza con él. No puede ir adentro de .tubo porque un
     filtro vuelve a su elemento bloque contenedor, y entonces
     position:fixed deja de estar fijo y se va con el scroll. -->
<div class="tubo__fijo">

<div class="crt" aria-hidden="true"><div class="crt__scan"></div><div class="crt__bloom"></div></div>

<div class="oia" aria-hidden="true">
  <span class="oia__cell"><b id="oia-sys"></b></span>
  <span class="oia__cell">PANEL DE CONTROL</span>
  <span class="oia__cell oia__pos" id="oia-pos">—</span>
</div>

</div>

<!-- El gabinete NO se curva: es el mueble, no la imagen. -->
<div class="gabinete" aria-hidden="true">
  <div class="gabinete__vidrio"></div>
  <div class="gabinete__marco"></div>
</div>

<!-- ── el filtro del tubo ──────────────────────────────────
     feDisplacementMap toma cada pixel del destino y lo va a buscar
     al origen corrido segun el color del mapa:
        destino(x,y) = origen(x + s*(R-.5), y + s*(G-.5))
     El mapa es un PNG de 128px generado con la formula del abombado
     (dx = nx*ny^2, dy = ny*nx^2): el corrimiento crece hacia las
     orillas y depende del OTRO eje, que es lo que pandea las rectas.
     Va incrustado para que no haya una peticion mas ni un instante
     en que el filtro exista sin su mapa. La escala la pone tubo.js,
     porque depende del tamano de la ventana. -->

<script src="config.js"></script>
<script>
const TINTAS = [null, "#ff2d95", "#a855f7", "#ffd9ee"];
const FONDO  = "#0d0410";
const N      = 12;

const $ = s => document.querySelector(s);
const puerta = $("#puerta"), lista = $("#lista"), pmsg = $("#p-msg");
let datos = null;

function avisa(t, err){
  pmsg.textContent = t ? (err ? ">>> " : "*** ") + t : "";
  pmsg.className = "msg " + (t ? (err ? "msg--err" : "msg--ok") : "");
}

function token(){ return sessionStorage.getItem("hmt_token") || ""; }

async function carga(){
  const r = await fetch(API + "/registros", { headers: { authorization: "Bearer " + token() } });
  if (r.status === 401){ sessionStorage.removeItem("hmt_token"); throw new Error("TOKEN INCORRECTO."); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.mensaje || ("HTTP " + r.status));
  return d;
}

function emblema(cv, codigo){
  const ctx = cv.getContext("2d"), paso = cv.width / N;
  ctx.fillStyle = FONDO; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < N * N; i++){
    const v = +codigo[i] || 0;
    if (!v) continue;
    ctx.fillStyle = TINTAS[v];
    ctx.fillRect((i % N) * paso, Math.floor(i / N) * paso, Math.ceil(paso), Math.ceil(paso));
  }
}

function resumen(d){
  $("#l-stat").textContent = `${d.registrados} / ${d.cupo}`;
  $("#l-sum").innerHTML =
    `REGISTRADOS <b>${d.registrados}</b>` +
    `<span>CUPO <b>${d.cupo}</b></span>` +
    `<span>QUEDAN <b>${d.quedan}</b></span>` +
    `<span>OPERADORES <b>${(d.registros || datos.registros || []).reduce((n, r) => n + r.integrantes.length, 0)}</b></span>`;
}

function pinta(d){
  datos = d;
  $("#f-cupo").value = d.cupo;
  resumen(d);

  const cuerpo = $("#l-cuerpo");
  cuerpo.textContent = "";
  if (!d.registros.length){
    cuerpo.innerHTML = '<p class="vacio">TODAVÍA NO HAY EQUIPOS REGISTRADOS.</p>';
    return;
  }

  for (const r of d.registros){
    const fila = document.createElement("article");
    fila.className = "eq";

    const cv = document.createElement("canvas");
    cv.width = cv.height = 84;
    fila.appendChild(cv);

    const info = document.createElement("div");
    const fecha = new Date(r.creado).toLocaleString("es-MX",
      { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    info.innerHTML =
      `<p class="eq__id">${r.folio} &middot; ${fecha}</p>` +
      `<p class="eq__name"></p>` +
      `<p class="eq__meta"><a href="mailto:"></a></p>`;
    info.querySelector(".eq__name").textContent = r.equipo;
    const a = info.querySelector("a");
    a.textContent = r.correo;
    a.href = "mailto:" + r.correo;
    fila.appendChild(info);

    const ul = document.createElement("ul");
    ul.className = "eq__crew";
    r.integrantes.forEach((i, n) => {
      const li = document.createElement("li");
      const b = document.createElement("b");
      b.textContent = i.nombre;
      if (n + 1 === r.lider){
        const tag = document.createElement("span");
        tag.className = "tag"; tag.textContent = "LÍDER";
        li.appendChild(tag);
      }
      li.appendChild(b);
      const tel = document.createElement("span");
      tel.className = "tel"; tel.textContent = i.telefono || "—";
      li.appendChild(tel);
      ul.appendChild(li);
    });
    fila.appendChild(ul);
    fila.appendChild(zonaBorrar(r, fila));

    cuerpo.appendChild(fila);
    emblema(cv, r.emblema);
  }
}

/* Borrar es irreversible, así que va en dos pasos y el aviso dice a quién
   se está borrando. Se cancela solo a los 8 segundos. */
function zonaBorrar(r, fila){
  const zona = document.createElement("p");
  zona.className = "eq__borrar";

  const reposo = () => {
    zona.textContent = "";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "BORRAR EQUIPO";
    b.addEventListener("click", preguntar);
    zona.appendChild(b);
  };

  let reloj = null;
  const preguntar = () => {
    zona.textContent = "";
    const aviso = document.createElement("span");
    aviso.className = "aviso";
    aviso.textContent = `¿Borrar «${r.equipo}»? No se puede deshacer.`;
    const si = document.createElement("button");
    si.type = "button"; si.className = "si"; si.textContent = "SÍ, BORRAR";
    si.addEventListener("click", () => { clearTimeout(reloj); borrar(); });
    const no = document.createElement("button");
    no.type = "button"; no.textContent = "CANCELAR";
    no.addEventListener("click", () => { clearTimeout(reloj); reposo(); });
    zona.append(aviso, si, no);
    reloj = setTimeout(reposo, 8000);
  };

  const borrar = async () => {
    zona.textContent = "";
    const esperando = document.createElement("span");
    esperando.className = "aviso";
    esperando.textContent = "Borrando...";
    zona.appendChild(esperando);
    try {
      const resp = await fetch(`${API}/registros?id=${r.id}`, {
        method: "DELETE",
        headers: { authorization: "Bearer " + token() },
      });
      const d = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(d.mensaje || ("HTTP " + resp.status));

      fila.classList.add("eq--fuera");
      datos.registros = datos.registros.filter(x => x.id !== r.id);
      resumen({ cupo: d.cupo, registrados: d.registrados, quedan: d.quedan });
      $("#f-cupo").value = d.cupo;
      setTimeout(() => {
        fila.remove();
        if (!datos.registros.length)
          $("#l-cuerpo").innerHTML = '<p class="vacio">TODAVÍA NO HAY EQUIPOS REGISTRADOS.</p>';
      }, 400);
    } catch (e) {
      zona.textContent = "";
      const err = document.createElement("span");
      err.className = "aviso";
      err.textContent = "No se pudo borrar: " + e.message;
      zona.appendChild(err);
      setTimeout(reposo, 4000);
    }
  };

  reposo();
  return zona;
}

/* Cambiar el cupo. Se guarda en la base, no en la variable de entorno,
   así que aplica de inmediato sin redesplegar. */
async function guardaCupo(){
  const campo = $("#f-cupo"), nota = $("#cupo-msg"), boton = $("#b-cupo");
  const n = Number(campo.value);
  const di = (t, clase) => { nota.textContent = t; nota.className = "nota " + (clase || ""); };

  if (!Number.isInteger(n) || n < 1 || n > 500)
    return di("Tiene que ser un entero entre 1 y 500.", "err");

  boton.disabled = true;
  di("Guardando...");
  try {
    const resp = await fetch(API + "/ajustes", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + token() },
      body: JSON.stringify({ cupo: n }),
    });
    const d = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(d.mensaje || ("HTTP " + resp.status));

    resumen({ cupo: d.cupo, registrados: d.registrados, quedan: d.quedan });
    if (datos) datos.cupo = d.cupo;
    di(d.cerrado
      ? `Cupo en ${d.cupo}. Ya hay ${d.registrados} equipos: el registro queda CERRADO.`
      : `Cupo en ${d.cupo}. Quedan ${d.quedan} lugares.`, "ok");
  } catch (e) {
    di("No se pudo guardar: " + e.message, "err");
  } finally {
    boton.disabled = false;
  }
}

async function abre(){
  try {
    const d = await carga();
    puerta.hidden = true;
    lista.hidden = false;
    pinta(d);
    $("#oia-pos").textContent = `${d.registrados}/${String(d.cupo).padStart(3, "0")}`;
    avisa("");
  } catch (e) {
    puerta.hidden = false;
    lista.hidden = true;
    avisa(e.message, true);
  }
}

$("#f-puerta").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#f-token").value.trim();
  if (!v) return avisa("ESCRIBE LA CONTRASEÑA.", true);
  sessionStorage.setItem("hmt_token", v);
  $("#f-token").value = "";
  avisa("VERIFICANDO...", false);
  abre();
});

$("#b-refresh").addEventListener("click", abre);
$("#b-cupo").addEventListener("click", guardaCupo);
$("#f-cupo").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); guardaCupo(); } });
$("#b-salir").addEventListener("click", () => {
  sessionStorage.removeItem("hmt_token");
  location.reload();
});

$("#b-csv").addEventListener("click", () => {
  if (!datos) return;
  const esc = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const filas = [["folio","equipo","correo","registrado","integrante","telefono","lider","emblema"]];
  for (const r of datos.registros){
    r.integrantes.forEach((i, n) => {
      filas.push([r.folio, r.equipo, r.correo, r.creado, i.nombre, i.telefono,
                  n + 1 === r.lider ? "si" : "no", n === 0 ? r.emblema : ""].map(esc));
    });
  }
  // BOM para que Excel abra los acentos bien
  const blob = new Blob(["﻿" + filas.map(f => f.join(",")).join("\r\n")],
                        { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hackmethon-equipos.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

if (token()) abre();
</script>
</body>
</html>
